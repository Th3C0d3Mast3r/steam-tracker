<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>

</head>

<body>

<script>

const DB_NAME="Steam Tracker";
const DB_VERSION=1;

let db=null;


function openDB(){

    return new Promise((resolve,reject)=>{

        const request=indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded=function(event){

            const database=event.target.result;

            if(!database.objectStoreNames.contains("games")){

                database.createObjectStore(
                    "games",
                    {
                        keyPath:"appid"
                    }
                );

            }

            if(!database.objectStoreNames.contains("price_history")){

                const historyStore=database.createObjectStore(
                    "price_history",
                    {
                        keyPath:"id",
                        autoIncrement:true
                    }
                );

                historyStore.createIndex(
                    "appid",
                    "appid",
                    {
                        unique:false
                    }
                );

            }

        };

        request.onsuccess=function(event){

            db=event.target.result;

            resolve(db);

        };

        request.onerror=function(event){

            reject(event.target.error);

        };

    });

}


function getGames(){

    return new Promise((resolve,reject)=>{

        const transaction=db.transaction(
            ["games"],
            "readonly"
        );

        const store=transaction.objectStore("games");

        const request=store.getAll();

        request.onsuccess=function(){

            resolve(request.result);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


function saveGame(game){

    return new Promise((resolve,reject)=>{

        const transaction=db.transaction(
            ["games"],
            "readwrite"
        );

        const store=transaction.objectStore("games");

        const request=store.put(game);

        request.onsuccess=function(){

            resolve(true);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


function deleteGame(appid){

    return new Promise((resolve,reject)=>{

        const transaction=db.transaction(
            ["games"],
            "readwrite"
        );

        const store=transaction.objectStore("games");

        const request=store.delete(appid);

        request.onsuccess=function(){

            resolve(true);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


function savePrice(appid,price){

    return new Promise((resolve,reject)=>{

        const transaction=db.transaction(
            ["price_history"],
            "readwrite"
        );

        const store=transaction.objectStore("price_history");

        const request=store.add({

            appid:appid,

            price:price,

            timestamp:new Date().toISOString()

        });

        request.onsuccess=function(){

            resolve(true);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


function getPriceHistory(appid){

    return new Promise((resolve,reject)=>{

        const transaction=db.transaction(
            ["price_history"],
            "readonly"
        );

        const store=transaction.objectStore("price_history");

        const index=store.index("appid");

        const request=index.getAll(appid);

        request.onsuccess=function(){

            resolve(request.result);

        };

        request.onerror=function(){

            reject(request.error);

        };

    });

}


async function executeCommand(command){

    await openDB();

    let result=null;


    if(command.action==="get_games"){

        result=await getGames();

    }


    else if(command.action==="save_game"){

        await saveGame(command.game);

        result={
            success:true
        };

    }


    else if(command.action==="delete_game"){

        await deleteGame(command.appid);

        result={
            success:true
        };

    }


    else if(command.action==="save_price"){

        await savePrice(
            command.appid,
            command.price
        );

        result={
            success:true
        };

    }


    else if(command.action==="get_price_history"){

        result=await getPriceHistory(
            command.appid
        );

    }


    Streamlit.setComponentValue(result);

}


function onRender(event){

    const args=event.detail.args;

    executeCommand(args);

}


Streamlit.events.addEventListener(
    Streamlit.RENDER_EVENT,
    onRender
);


Streamlit.setComponentReady();


Streamlit.setFrameHeight(0);

</script>
</body>
</html>
